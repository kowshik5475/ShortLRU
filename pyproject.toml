[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlru"
version = "1.0.0"
description = "Educational command-line URL shortener demonstrating hashing, Base62, LRU caching, data structures, and OOP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
report = ["matplotlib>=3.7"]

[project.scripts]
shortlru = "shortlru.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["shortlru*"]
